# Builds the contest image of huy1 @ 74ff52a (main is NOT changed) and pushes it to ghcr.io/huypg-zenai/huy1 (private).
name: image
on:
  push:
    branches: [image-build]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
env:
  SRC_REF: 74ff52a9203beb890639d8a4e9acfac63eda6f4a
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Free disk (image is ~20-30 GB)
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /usr/local/lib/node_modules || true
          sudo docker system prune -af || true
          sudo systemctl stop docker docker.socket
          sudo mkdir -p /mnt/docker && sudo rsync -a /var/lib/docker/ /mnt/docker/ && sudo rm -rf /var/lib/docker && sudo ln -s /mnt/docker /var/lib/docker
          sudo systemctl start docker
          df -h / /mnt
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SRC_REF }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          provenance: false
          tags: |
            ghcr.io/huypg-zenai/huy1:1.0
            ghcr.io/huypg-zenai/huy1:74ff52a
      - name: Disk after build
        if: always()
        run: df -h / /mnt
